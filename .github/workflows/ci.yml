name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Cancel in-progress runs of the same branch / PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/swiftship_test
  REDIS_URL: redis://localhost:6379

jobs:
  graph:
    name: Nx graph guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'npm' }
      - run: npm ci
      - run: node scripts/check-nx-graph.mjs
      - name: PrismaCompat audit (SS-040)
        # Fails the run if a new @prisma/client or PrismaCompat import
        # sneaks into a domain/platform lib. The shim is being removed
        # 1 lib/week — see MIGRATION.md §7 for the migration runbook.
        run: npm run audit:prisma

  security:
    # SS-104: dependency-audit summary + gitleaks secret scan.
    name: Security (audit + secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'npm' }
      - run: npm ci
      - name: gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: npm audit (report only, non-blocking)
        run: npm audit --audit-level=critical || true

  lint:
    name: Lint (non-blocking — SS-108)
    # SS-108: eslint only became runnable in SS-101; the first full sweep
    # surfaced ~2,900 type-safety errors (mostly any-typed carrier/bank
    # payloads). Tracked in SS-108 — flip continue-on-error back to false
    # when the sweep lands.
    continue-on-error: true
    runs-on: ubuntu-latest
    needs: [graph]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'npm' }
      - run: npm ci
      - run: npx nx run-many --target=lint --all --parallel=3

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'npm' }
      - run: npm ci
      - run: npx nx run-many --target=typecheck --all --parallel=3

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: swiftship_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'npm' }
      - run: npm ci
      - run: npx nx run-many --target=test --all --parallel=3 --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/**

  e2e:
    name: E2E (api)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: swiftship_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'npm' }
      - run: npm ci
      # SS-102: the service container uses postgres:postgres creds and the
      # harness validates DATABASE_URL via Joi before the app compiles.
      - run: npx nx run api-e2e:e2e
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/swiftship_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: e2e-ci-secret

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'npm' }
      - run: npm ci
      - run: npx nx run-many --target=build --all --parallel=3
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
