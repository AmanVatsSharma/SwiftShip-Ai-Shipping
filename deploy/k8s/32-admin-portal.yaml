apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-portal
  namespace: swiftship
  labels:
    app: admin-portal
    app.kubernetes.io/part-of: swiftship
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-portal
  template:
    metadata:
      labels:
        app: admin-portal
    spec:
      imagePullSecrets:
      - name: ghcr-pull-secret
      containers:
      - name: admin-portal
        image: ghcr.io/swiftship/admin-portal:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: swiftship-config
              key: NODE_ENV
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: swiftship-config
              key: PORT
        - name: NEXT_PUBLIC_API_URL
          valueFrom:
            configMapKeyRef:
              name: swiftship-config
              key: NEXT_PUBLIC_API_URL
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: admin-portal
  namespace: swiftship
  labels:
    app.kubernetes.io/part-of: swiftship
spec:
  selector:
    app: admin-portal
  ports:
  - port: 80
    targetPort: 3000
    name: http
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: admin-portal-ingress
  namespace: swiftship
  labels:
    app.kubernetes.io/part-of: swiftship
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
  - host: admin.swiftship.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: admin-portal
            port:
              number: 80
---