apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: swiftship
  labels:
    app: api
    app.kubernetes.io/part-of: swiftship
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      imagePullSecrets:
      - name: ghcr-pull-secret
      containers:
      - name: api
        image: ghcr.io/swiftship/api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        envFrom:
        - configMapRef:
            name: swiftship-config
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: swiftship-secrets
              key: DATABASE_URL
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: swiftship-secrets
              key: JWT_SECRET
        - name: STRIPE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: swiftship-secrets
              key: STRIPE_SECRET_KEY
        - name: RAZORPAY_KEY_SECRET
          valueFrom:
            secretKeyRef:
              name: swiftship-secrets
              key: RAZORPAY_KEY_SECRET
        - name: SHOPIFY_API_SECRET
          valueFrom:
            secretKeyRef:
              name: swiftship-secrets
              key: SHOPIFY_API_SECRET
        - name: SENDGRID_API_KEY
          valueFrom:
            secretKeyRef:
              name: swiftship-secrets
              key: SENDGRID_API_KEY
        - name: S3_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: swiftship-secrets
              key: S3_SECRET_ACCESS_KEY
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: swiftship
  labels:
    app.kubernetes.io/part-of: swiftship
spec:
  selector:
    app: api
  ports:
  - port: 80
    targetPort: 3000
    name: http
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-ingress
  namespace: swiftship
  labels:
    app.kubernetes.io/part-of: swiftship
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
  - host: api.swiftship.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api
            port:
              number: 80
---