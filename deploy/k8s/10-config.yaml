apiVersion: v1
kind: ConfigMap
metadata:
  name: swiftship-config
  namespace: swiftship
  labels:
    app.kubernetes.io/part-of: swiftship
data:
  NODE_ENV: "production"
  PORT: "3000"
  REDIS_URL: "redis://redis.swiftship.svc.cluster.local:6379"
  CORS_ORIGIN: "https://swiftship.ai,https://admin.swiftship.ai"
  APP_URL: "https://swiftship.ai"
  NEXT_PUBLIC_API_URL: "https://api.swiftship.ai/graphql"
---
apiVersion: v1
kind: Secret
metadata:
  name: swiftship-secrets
  namespace: swiftship
  labels:
    app.kubernetes.io/part-of: swiftship
type: Opaque
stringData:
  DATABASE_URL: "postgresql://swiftship:CHANGEME@postgres.swiftship.svc.cluster.local:5432/swiftship?schema=public"
  JWT_SECRET: "CHANGEME-replace-with-a-long-random-string"
  STRIPE_SECRET_KEY: "CHANGEME"
  RAZORPAY_KEY_SECRET: "CHANGEME"
  SHOPIFY_API_SECRET: "CHANGEME"
  SENDGRID_API_KEY: "CHANGEME"
  S3_SECRET_ACCESS_KEY: "CHANGEME"
