auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 0

common:
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      index_directory: /loki/index
  replication_factor: 1
  role: read
  ring:
    kvstore:
      store: memberlist

schema_config:
  configs:
    - from: "2024-01-01"
      store: boltdb-shipper
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 168h  # 7 days

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  alertmanager_url: ""