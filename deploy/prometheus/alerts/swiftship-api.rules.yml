  # HTTP 5xx / latency — COMMENTED: metrics do not exist yet.
  # Enable after adopting prom-client with an http request histogram,
  # e.g. histogram `http_request_duration_seconds` with labels
  # {route, method, status_code}. Metric names below follow that
