# SwiftShip API — Prometheus alert rules
#
# Loaded via `rule_files` in deploy/prometheus/prometheus.yml. Raw `groups:`
# format, consumable by both vanilla Prometheus and a PrometheusRule CRD
# (`spec.groups` — wrap with kubectl-slice / helm when moving to k8s).
#
# METRIC REALITY CHECK (2026-08-30) — what GET /metrics actually exposes.
# The endpoint is libs/observability/src/lib/metrics.controller.ts (wired in
# apps/api/src/app.module.ts). It renders exactly four gauges and NO counters
# or histograms:
#
#   process_uptime_seconds        (gauge, seconds since controller init)
#   nodejs_heap_size_used_bytes   (gauge)
#   nodejs_heap_size_total_bytes  (gauge)
#   nodejs_rss_bytes              (gauge)
#
# Prometheus synthesizes `up`, `scrape_duration_seconds`, etc. per job —
# those are usable too.
#
# The following metrics DO NOT EXIST today (no prom-client dependency, no
# http instrumentation, no exporter jobs for postgres/redis in
# deploy/prometheus/prometheus.yml). Their rules are included COMMENTED OUT
# so they can be enabled the moment the metric lands — do not uncomment
# blindly, the alert would either never fire or (with absent()) always fire:
#
#   - http_request_duration_seconds_count / _bucket   (5xx rate, p95 latency)
#     NOTE: libs/domains/metrics/src/lib/metrics.service.ts is an in-memory
#     JSON counter (not Prometheus format, not wired into the /metrics
#     endpoint). Adopting prom-client + an http histogram is the prerequisite.
#   - pg_up / up{job="postgres-exporter"}             (Postgres connectivity)
#   - up{job="redis-exporter"}                        (Redis connectivity)
#   - any unhandled-error counter                     (error log rate; logs are
#     JSON to Loki via promtail — a Loki ruler alert on
#     `{compose_service="swiftship-api"} | json | level="error"` is the
#     right home for this once a ruler is configured)
#   - carrier circuit-breaker state                   (breaker state lives in
#     Redis keys `breaker:<CARRIER>:state`, not in metrics; see
#     chaos/runbooks/carrier-timeout.md)

groups:
  # ------------------------------------------------------------------
  # Availability — these rules are LIVE (metrics exist today)
  # ------------------------------------------------------------------
  - name: swiftship-api.availability
    rules:
      - alert: SwiftShipApiDown
        expr: up{job="swiftship-api"} == 0
        for: 2m
        labels:
          severity: critical
          service: swiftship-api
        annotations:
          summary: "swiftship-api scrape target is down ({{ $labels.instance }})"
          description: >-
            Prometheus has failed to scrape http://{{ $labels.instance }}/metrics
            for 2 minutes. Process dead, pod evicted, or network partition.
            Liveness/readiness probes hit /health and /health/ready
            (deploy/k8s/30-api.yaml).
          runbook: "docs/runbook.md#1-api-5xx-spike--api-down"

      - alert: SwiftShipApiScrapeTargetMissing
        expr: absent(up{job="swiftship-api"})
        for: 5m
        labels:
          severity: critical
          service: swiftship-api
        annotations:
          summary: "swiftship-api scrape job has no targets"
          description: >-
            up{job="swiftship-api"} is absent entirely — the scrape job was
            removed from deploy/prometheus/prometheus.yml or Prometheus lost
            its configuration. This is a monitoring-config regression, not an
            app outage.
          runbook: "docs/runbook.md#6-monitoring-itself-broken"

      - alert: SwiftShipApiSlowScrape
        expr: scrape_duration_seconds{job="swiftship-api"} > 2
        for: 10m
        labels:
          severity: warning
          service: swiftship-api
        annotations:
          summary: "swiftship-api /metrics scrape takes {{ $value }}s"
          description: >-
            The metrics endpoint is slow — usually event-loop saturation
            starving the HTTP server, or too many scrape targets on one
            instance.

  # ------------------------------------------------------------------
  # Process health — LIVE (process_uptime_seconds / heap gauges exist)
  # ------------------------------------------------------------------
  - name: swiftship-api.process
    rules:
      - alert: SwiftShipApiRestarted
        expr: process_uptime_seconds{job="swiftship-api"} < 180
        labels:
          severity: warning
          service: swiftship-api
        annotations:
          summary: "swiftship-api restarted {{ $value | humanize }}s ago"
          description: >-
            process_uptime_seconds is under 3 minutes — the process (or its
            pod) just started. Expected during deploys; a page outside a
            deploy window means a crash/OOM-kill loop. Check
            `kubectl -n swiftship rollout history deploy/api` and pod events
            before assuming a code crash.
          runbook: "docs/runbook.md#1-api-5xx-spike--api-down"

      - alert: SwiftShipApiUptimeFlapping
        expr: process_uptime_seconds{job="swiftship-api"} < 600
        for: 30m
        labels:
          severity: critical
          service: swiftship-api
        annotations:
          summary: "swiftship-api never reaches 10 minutes of uptime"
          description: >-
            Uptime has stayed below 10 minutes for 30 minutes — the process
            is crash-looping (OOM, unhandled exception at boot, or a failing
            liveness probe causing restart thrash).
          runbook: "docs/runbook.md#1-api-5xx-spike--api-down"

      - alert: SwiftShipApiHeapPressure
        expr: >-
          nodejs_heap_size_used_bytes{job="swiftship-api"}
            / nodejs_heap_size_total_bytes{job="swiftship-api"} > 0.90
        for: 10m
        labels:
          severity: warning
          service: swiftship-api
        annotations:
          summary: "Node heap >90% of heap total for 10m"
          description: >-
            Sustained heap pressure precedes long GC pauses and OOM kills.
            Cross-check nodejs_rss_bytes and the memory panels in
            deploy/grafana/dashboards/swiftship-api.json.

      # Threshold is a heuristic for the 512Mi-1Gi containers in
      # deploy/k8s/30-api.yaml — tune when resource requests change.
      - alert: SwiftShipApiRssHigh
        expr: nodejs_rss_bytes{job="swiftship-api"} > 1.5e9
        for: 15m
        labels:
          severity: warning
          service: swiftship-api
        annotations:
          summary: "swiftship-api RSS above 1.5GiB ({{ $value | humanize1024 }}B)"
          description: >-
            Resident memory is high for a single Node process. If it keeps
            climbing, the next stop is the kernel OOM killer. Take a heap
            snapshot before restarting.

