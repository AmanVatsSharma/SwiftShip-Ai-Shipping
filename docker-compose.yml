services:
  postgres:
    image: postgres:16
    container_name: swiftship-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: swiftship
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d swiftship"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - swiftship-net

  redis:
    image: redis:7
    container_name: swiftship-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - swiftship-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: swiftship-api
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/swiftship?schema=public
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      SHOPIFY_API_KEY: ${SHOPIFY_API_KEY:-}
      SHOPIFY_API_SECRET: ${SHOPIFY_API_SECRET:-}
      SHOPIFY_APP_URL: ${SHOPIFY_APP_URL:-}
      SHOPIFY_SCOPES: ${SHOPIFY_SCOPES:-}
      DELHIVERY_TOKEN: ${DELHIVERY_TOKEN:-}
      XPRESSBEES_TOKEN: ${XPRESSBEES_TOKEN:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      PAYMENT_DEFAULT_GATEWAY: ${PAYMENT_DEFAULT_GATEWAY:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-}
      APP_URL: ${APP_URL:-}
      GSTN_API_URL: ${GSTN_API_URL:-}
      GSTN_API_KEY: ${GSTN_API_KEY:-}
      GSTN_CLIENT_ID: ${GSTN_CLIENT_ID:-}
      GSTN_CLIENT_SECRET: ${GSTN_CLIENT_SECRET:-}
      GSTN_SIGNATURE_SECRET: ${GSTN_SIGNATURE_SECRET:-}
      GSTN_RETRY_ATTEMPTS: ${GSTN_RETRY_ATTEMPTS:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-stub}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/metrics >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - swiftship-net

  web:
    image: nginx:1.27-alpine
    container_name: swiftship-web
    depends_on:
      - api
    ports:
      - "4300:80"
    volumes:
      - ./apps/web/dist:/usr/share/nginx/html:ro
      - ./apps/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - swiftship-net

  admin-portal:
    image: nginx:1.27-alpine
    container_name: swiftship-admin-portal
    depends_on:
      - api
    ports:
      - "4200:80"
    volumes:
      - ./apps/admin-portal/dist:/usr/share/nginx/html:ro
      - ./apps/admin-portal/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - swiftship-net

volumes:
  pgdata:
    name: pgdata

networks:
  swiftship-net:
    name: swiftship-net
    driver: bridge
