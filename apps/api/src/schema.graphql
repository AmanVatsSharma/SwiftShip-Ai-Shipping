  resetPassword(token: String!, newPassword: String!): MessageResponse!

  """Refresh access and refresh tokens"""
  refreshToken(refreshToken: String!): AuthPayload!

  """Submit a KYC payload (PAN, GSTIN, bank). Triggers async verify."""
  submitKyc(input: SubmitKycInput!): KycRecordModel!
  createShipment(input: CreateShipmentInput!): Shipment!
  updateShipment(input: UpdateShipmentInput!): Shipment!
  cancelShipment(id: Int!): Shipment!
  generateShippingLabel(input: CreateLabelInput!): ShippingLabel!
  ingestTracking(input: IngestTrackingInput!): TrackingEvent!
  createWarehouse(input: CreateWarehouseInput!): Warehouse!
  updateWarehouse(input: UpdateWarehouseInput!): Warehouse!
  deleteWarehouse(id: Int!): Boolean!
  upsertCoverage(input: UpsertWarehouseCoverageInput!): WarehouseCoverage!
  deleteCoverage(id: Int!): Boolean!

  """Create a new invoice"""
  createInvoice(input: CreateInvoiceInput!): Invoice!

  """Generate PDF for an invoice"""
  generateInvoicePdf(invoiceId: String!): String!

  """Mark invoice as paid"""
  markInvoiceAsPaid(invoiceId: String!, paidAt: DateTime): Invoice!

  """Cancel an invoice"""
  cancelInvoice(invoiceId: String!): Invoice!

  """Generate (or refresh) the GST breakdown for an invoice."""
  generateGstInvoice(input: GenerateGstInvoiceInput!): GstInvoice!

  """
  Issue an E-way bill via the configured provider (default: ClearTax sandbox).
  """
  generateEwayBill(input: GenerateEwayBillInput!): GstEwayBill!

  """Cancel an active E-way bill."""
  cancelEwayBill(id: Int!, reason: String): GstEwayBill!
  createUser(createUserInput: CreateUserInput!): User!
  updateUser(updateUserInput: UpdateUserInput!): User!
  removeUser(id: Int!): User!
  createRole(createRoleInput: CreateRoleInput!): Role!
  updateRole(updateRoleInput: UpdateRoleInput!): Role!
  removeRole(id: Int!): Role!

  """Create a COD remittance record"""
  remitCod(orderId: Int!, amount: Float!, referenceId: String): String!

  """Transition an NDR case to a new state. Throws if illegal."""
  transitionNdr(id: Int!, to: NdrCaseStatus!, reason: String): NdrCase!

  """Mark an NDR case as DELIVERED (customer successfully re-attempted)."""
  markDelivered(id: Int!): NdrCase!

  """Escalate an NDR case to RTO_INITIATED (max attempts exhausted)."""
  initiateRto(id: Int!): NdrCase!

  """
  Resolve an RTO dispute. The carrier-fault path optionally records a merchant compensation amount (paise).
  """
  resolveRtoDispute(id: Int!, status: String!, resolution: String!, refundedPaise: Int): RtoDispute!

  """Generate manifest for shipments"""
  generateManifest(generateManifestInput: GenerateManifestInput!): ManifestEntity!
  updateOnboardingState(userId: Int!, updateOnboardingInput: UpdateOnboardingInput!): OnboardingStateModel!

  """Schedule a pickup for a shipment"""
  schedulePickup(schedulePickupInput: SchedulePickupInput!): String!

  """
  Connect a new e-commerce platform. Validates credentials with `testConnection` before persisting.
  """
  connectChannel(tenantId: Int!, input: ConnectChannelInput!): ChannelConnection!

  """Soft-delete (disconnect) a channel connection."""
  disconnectChannel(tenantId: Int!, channelId: ID!): ChannelConnection!

  """Kick a sync immediately. Returns the sync job row."""
  triggerChannelSync(tenantId: Int!, channelId: ID!, type: String!): ChannelSyncJob!

  """Update per-connection settings (sync mode, conflict resolution, etc.)."""
  updateChannelSettings(tenantId: Int!, channelId: ID!, settingsJson: String!): ChannelConnection!
}

