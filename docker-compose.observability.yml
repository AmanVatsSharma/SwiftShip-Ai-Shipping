services:
  # SS-028 — OpenTelemetry Collector. Receives OTLP/HTTP traces
  # from the api (and any future instrumented service) and forwards
  # to a configurable backend. The default exporter is `logging`
  # (writes spans to stdout for dev); set `OTEL_EXPORTER` in the
  # collector config to `otlp/<backend>` (e.g. otlp/honeycomb,
  # otlp/datadog, otlp/jaeger) to ship spans to your tracing SaaS.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    container_name: swiftship-otel-collector
    restart: unless-stopped
    command:
      - '--config=/etc/otelcol/config.yaml'
    volumes:
      - ./deploy/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4318:4318"   # OTLP HTTP receiver
      - "4317:4317"   # OTLP gRPC receiver (optional)
    networks:
      - swiftship-obs

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: swiftship-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - swiftship-obs

  loki:
    image: grafana/loki:2.9.4
    container_name: swiftship-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    user: "10001:10001"
    volumes:
      - ./deploy/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks:
      - swiftship-obs

  promtail:
    image: grafana/promtail:2.9.4
    container_name: swiftship-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./deploy/loki/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - swiftship-obs

  grafana:
    image: grafana/grafana:10.4.2
    container_name: swiftship-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - swiftship-obs

volumes:
  prometheus-data:
    name: swiftship-prometheus-data
  loki-data:
    name: swiftship-loki-data
  grafana-data:
    name: swiftship-grafana-data

networks:
  swiftship-obs:
    name: swiftship-obs
    driver: bridge
